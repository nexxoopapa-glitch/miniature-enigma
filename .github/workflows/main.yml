name: Pure RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP & Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=Yes
          Restart-Service -Name TermService -Force

      - name: Set RDP User Password
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
          Write-Host "Password set for runneradmin"

      - name: Install Tailscale via Winget
        shell: cmd
        run: |
          echo === Installing Tailscale via winget ===
          winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
          echo === Waiting for install ===
          timeout /t 25 /nobreak >nul
          echo === Checking locations ===
          if exist "C:\Program Files\Tailscale\tailscale.exe" echo FOUND in Program Files
          if exist "C:\Program Files (x86)\Tailscale\tailscale.exe" echo FOUND in Program Files x86

      - name: Debug - Locate tailscale.exe
        shell: cmd
        run: |
          echo === Searching common paths ===
          dir "C:\Program Files\Tailscale\*.exe" /b 2>nul
          dir "C:\Program Files (x86)\Tailscale\*.exe" /b 2>nul
          dir "C:\ProgramData\Tailscale\*.exe" /b 2>nul
          echo === where command ===
          where tailscale 2>nul
          echo === Registry check ===
          reg query "HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /f Tailscale 2>nul

      - name: Establish Tailscale Connection
        shell: cmd
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set TS_EXE=
          if exist "C:\Program Files\Tailscale\tailscale.exe" set TS_EXE=C:\Program Files\Tailscale\tailscale.exe
          if exist "C:\Program Files (x86)\Tailscale\tailscale.exe" set TS_EXE=C:\Program Files (x86)\Tailscale\tailscale.exe

          if "%TS_EXE%"=="" (
            echo ERROR: tailscale.exe not found
            exit /b 1
          )

          echo Using: %TS_EXE%
          "%TS_EXE%" up --authkey=%TS_AUTHKEY% --hostname=gh-rdp-runner --accept-routes

          if errorlevel 1 (
            echo ERROR: Tailscale connection failed
            exit /b 1
          )

          echo === Getting IP ===
          timeout /t 10 /nobreak >nul
          "%TS_EXE%" ip -4

      - name: Show Connection Details & Keep Alive
        shell: powershell
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            $tsExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          $tsIP = & $tsExe ip -4
          $tsIP = ($tsIP | Select-Object -First 1).Trim()

          Write-Host ""
          Write-Host "=============== RDP IS READY ==============="
          Write-Host "IP Address : $tsIP"
          Write-Host "Username   : runneradmin"
          Write-Host "Password   : WindowsRDP#2025"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Connect via your Tailscale app -> RDP (mstsc)"

          while ($true) {
            Write-Host "RDP Active - $(Get-Date)"
            Start-Sleep -Seconds 300
          }
